name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          CERT_PATH=$RUNNER_TEMP/cert.p12
          echo "$CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "temp_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "temp_password" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temp_password" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Verify certificate
        run: |
          security find-identity -v -p codesigning
          echo "---"
          security list-keychains

      - name: Build Release
        run: |
          xcodebuild \
            -project StandupAgent.xcodeproj \
            -scheme StandupAgent \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            CODE_SIGN_ENTITLEMENTS="StandupAgent/StandupAgent.entitlements" \
            build

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="build/Build/Products/Release/StandupAgent.app"
          ZIP_PATH="$RUNNER_TEMP/StandupAgent-notarize.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

          # Submit without --wait so we reliably capture the submission id
          SUBMISSION_ID=$(xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Submission ID: $SUBMISSION_ID"

          # Poll the submission status until Apple finishes (no artificial limit;
          # only the GitHub-hosted runner's 6h hard cap applies)
          STATUS="In Progress"
          i=0
          while true; do
            i=$((i + 1))
            STATUS=$(xcrun notarytool info "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --output-format json | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" != "In Progress" ]; then
              break
            fi
            sleep 30
          done

          # Always fetch the detailed log for diagnostics
          xcrun notarytool log "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" || true

          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization did not succeed: $STATUS"
            exit 1
          fi

          xcrun stapler staple "$APP_PATH"

      - name: Package as dmg
        run: |
          brew install create-dmg
          create-dmg \
            --volname "StandupAgent" \
            --window-size 540 380 \
            --icon-size 128 \
            --icon "StandupAgent.app" 130 170 \
            --app-drop-link 400 170 \
            --no-internet-enable \
            "StandupAgent.dmg" \
            "build/Build/Products/Release/StandupAgent.app"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: StandupAgent.dmg
          body: |
            ## 安装方式
            1. 下载 `StandupAgent.dmg`，双击打开
            2. 将 `StandupAgent.app` 拖入 Applications 文件夹
            3. 首次使用：在设置里填入 AI API Key

            ## 系统要求
            - macOS 14.0+
            - 需要自备 Claude / ChatGPT / Gemini API Key
